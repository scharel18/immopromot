<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gérer les biens - ImmoPromot</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: #f8f9fa;
            color: #333;
        }

        header {
            background: white;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #c62828;
        }

        .container {
            padding: 40px 8%;
            max-width: 900px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
        }

        .form-container, .list-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        h3 {
            margin-top: 0;
            color: #c62828;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #666;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .status-aktiv { background: #e8f5e9; color: #2e7d32; }
        .status-verkauft { background: #ffebee; color: #c62828; }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-add { background: #c62828; color: white; width: 100%; font-size: 1rem; margin-top: 10px; }
        .btn-edit { background: #e3f2fd; color: #1976d2; }
        .btn-status { background: #f0f0f0; color: #444; }
        .btn-del { background: #fff0f0; color: #d32f2f; }
        .logout-btn { background: #f44336; color: white; border-radius: 20px; }

        /* MODAL STYLES */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%; max-width: 700px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 30px; }
        .btn-save { background: #c62828; color: white; flex: 2; }
        .btn-cancel { background: #eee; color: #333; flex: 1; }
    </style>
</head>

<body>

    <header>
        <h2>ImmoPromot Admin</h2>
        <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </header>

    <div class="container">
        <a href="dashboard.html" class="back-link">← Retour au Dashboard</a>

        <div class="form-container">
            <h3>Ajouter un nouveau bien (Immobilie hinzufügen)</h3>
            <form id="addPropertyForm">
                <div class="form-group">
                    <label>Titre du bien (Français) *</label>
                    <input type="text" id="add-title" required placeholder="Ex: Bel appartement au centre-ville">
                </div>
                
                <div class="grid-3">
                    <div class="form-group">
                        <label>Type *</label>
                        <select id="add-type">
                            <option value="acheter">Acheter (Vente)</option>
                            <option value="louer">Louer (Location)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prix (€) *</label>
                        <input type="number" id="add-preis" required placeholder="Format: 250000">
                    </div>
                    <div class="form-group">
                        <label>Lieu / Code Postal *</label>
                        <input type="text" id="add-ort" required placeholder="Ex: Luxembourg (1234)">
                    </div>
                </div>

                <div class="form-group">
                    <label>Description (Français)</label>
                    <textarea id="add-desc" rows="3" placeholder="Détails du bien..."></textarea>
                </div>

                <button type="submit" class="btn-add">Créer l'annonce (Immobilie speichern)</button>
            </form>
        </div>

        <div class="list-container">
            <h3>Inventaire des biens (Bestehende Immobilien)</h3>
            <div id="list">Chargement des biens...</div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Modifier le bien</h3>
            <input type="hidden" id="edit-id">

            <label>Titre (FR)</label>
            <input type="text" id="edit-title">

            <div class="grid-3">
                <div>
                    <label>Type</label>
                    <select id="edit-type">
                        <option value="acheter">Acheter</option>
                        <option value="louer">Louer</option>
                    </select>
                </div>
                <div>
                    <label>Prix (€)</label>
                    <input type="number" id="edit-preis">
                </div>
                <div>
                    <label>Lieu</label>
                    <input type="text" id="edit-ort">
                </div>
            </div>

            <label>Description (FR)</label>
            <textarea id="edit-desc" rows="3"></textarea>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="btn-save" onclick="saveEdit()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://tcljsecaawgczfguujsi.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjbGpzZWNhYXdnY3pmZ3V1anNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTAwMTgsImV4cCI6MjA4ODg4NjAxOH0.sO-iKn8hg1PKdAZnf1ez6dtASYH0PKId4Zx5OmGfHI8';

        // Umbenannt zu dbClient um den globalen Konflikt im Browser sicher zu umgehen
        const dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Logout Event
        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await dbClient.auth.signOut();
            window.location.replace("login.html");
        });

        // HINZUFÜGEN LOGIK (NEU)
        document.getElementById("addPropertyForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const newProperty = {
                title: document.getElementById("add-title").value,
                type: document.getElementById("add-type").value,
                preis: Number(document.getElementById("add-preis").value),
                ort: document.getElementById("add-ort").value,
                beschreibung: document.getElementById("add-desc").value,
                status: 'aktiv' // Neue Immobilien sind standardmäßig aktiv
            };

            const { error } = await dbClient.from('immoPromot').insert([newProperty]);

            if (error) {
                alert("Erreur lors de l'ajout: " + error.message);
            } else {
                alert("Bien ajouté avec succès !");
                document.getElementById("addPropertyForm").reset(); // Formular leeren
                load(); // Liste neu laden
            }
        });

        // LADEN LOGIK
        async function load() {
            const listDiv = document.getElementById('list');
            const { data, error } = await dbClient.from('immoPromot').select('*').order('created_at', { ascending: false });

            if (error) {
                listDiv.innerHTML = "Erreur de chargement: " + error.message;
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = "Aucun bien trouvé.";
                return;
            }

            listDiv.innerHTML = data.map(p => {
                const isSold = p.status === 'verkauft';
                return `
                <div class="item">
                    <div>
                        <strong>${p.title || 'Sans titre'}</strong><br>
                        <small style="color: #888;">${p.ort || 'Lieu inconnu'} | ${p.preis || 0} €</small><br>
                        <span class="status-pill ${isSold ? 'status-verkauft' : 'status-aktiv'}">${isSold ? 'Vendu' : 'Actif'}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-edit" onclick="openEdit('${p.id}')">Modifier</button>
                        <button class="btn-status" onclick="updateStatus('${p.id}', '${isSold ? 'aktiv' : 'verkauft'}')">
                            ${isSold ? 'Réactiver' : 'Vendu'}
                        </button>
                        <button class="btn-del" onclick="deleteItem('${p.id}')">Supprimer</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        // EDIT LOGIK
        window.openEdit = async (id) => {
            const { data, error } = await dbClient.from('immoPromot').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('edit-id').value = data.id;
                document.getElementById('edit-title').value = data.title || '';
                document.getElementById('edit-type').value = data.type || 'acheter';
                document.getElementById('edit-preis').value = data.preis || '';
                document.getElementById('edit-ort').value = data.ort || '';
                document.getElementById('edit-desc').value = data.beschreibung || '';
                document.getElementById('editModal').style.display = 'block';
            }
        };

        window.closeModal = () => { document.getElementById('editModal').style.display = 'none'; };

        window.saveEdit = async () => {
            const id = document.getElementById('edit-id').value;
            const updates = {
                title: document.getElementById('edit-title').value,
                type: document.getElementById('edit-type').value,
                preis: Number(document.getElementById('edit-preis').value),
                ort: document.getElementById('edit-ort').value,
                beschreibung: document.getElementById('edit-desc').value
            };

            const { error } = await dbClient.from('immoPromot').update(updates).eq('id', id);
            if (error) { alert("Erreur: " + error.message); } else { closeModal(); load(); }
        };

        window.updateStatus = async (id, newStatus) => {
            await dbClient.from('immoPromot').update({ status: newStatus }).eq('id', id);
            load();
        };

        window.deleteItem = async (id) => {
            if (confirm('Voulez-vous vraiment supprimer ce bien ?')) {
                await dbClient.from('immoPromot').delete().eq('id', id);
                load();
            }
        };

        load();
    </script>
</body>
</html>
