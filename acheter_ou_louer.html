<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acheter ou Louer - ImmoPromot</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico" />
    <style>
        /* --- RESET & FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body,
        html {
            width: 100%;
            background: #fff;
            color: #333;
            scroll-behavior: smooth;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #headerlogo {
            height: 60px;
        }

        nav#navmenu ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav#navmenu a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: 0.3s;
        }

        nav#navmenu a:hover,
        nav#navmenu .active {
            color: #c62828;
        }

        /* --- SPRACH-SWITCHER --- */
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lang-switcher {
            display: flex;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
        }

        .lang-btn {
            cursor: pointer;
            border: none;
            background: none;
            color: #ccc;
            transition: 0.3s;
            padding: 5px;
        }

        .lang-btn.active {
            color: #c62828;
        }

        /* --- HAMBURGER --- */
        #hamburger {
            cursor: pointer;
            width: 30px;
            height: 25px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        #hamburger span {
            display: block;
            height: 3px;
            background: #c62828;
            border-radius: 2px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1050px) {
            #hamburger {
                display: flex;
            }

            nav#navmenu {
                position: fixed;
                top: 90px;
                left: 0;
                width: 100%;
                background: white;
                max-height: 0;
                overflow: hidden;
                transition: 0.4s;
                z-index: 999;
            }

            nav#navmenu.active {
                max-height: 500px;
            }

            nav#navmenu ul {
                flex-direction: column;
                padding: 20px;
                text-align: center;
            }
        }

        /* --- SEITENINHALT --- */
        #Background {
            height: 40vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url("https://images.unsplash.com/photo-1560184897-ae75f418493e") no-repeat center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        #filter {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }

        .filter-btn {
            padding: 10px 25px;
            border-radius: 30px;
            border: none;
            background: #eee;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-btn.active {
            background: #c62828;
            color: white;
        }

        #properties {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            padding: 0 5% 40px 5%;
            min-height: 200px;
        }

        .property-box {
            background: white;
            width: 300px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .property-box:hover {
            transform: translateY(-5px);
        }

        .property-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .property-box h3 {
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .property-box p {
            color: #c62828;
            font-weight: 600;
            margin-top: 5px;
        }

        #overlay {
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <img id="headerlogo" src="./img/new_logo_2.svg" alt="logo" />

        <nav id="navmenu">
            <ul>
                <li><a href="index.html" data-i18n="nav_home">Accueil</a></li>
                <li><a href="acheter_ou_louer.html" class="active" data-i18n="nav_acheter">Nos Biens</a></li>
                <li><a href="vendre.html" data-i18n="nav_vendre">Vendre</a></li>
                <li><a href="investissement.html" data-i18n="nav_invest">Investissement</a></li>
                <li><a href="faire_gerer.html" data-i18n="nav_gerer">Faire Gérer</a></li>
                <li><a href="promoteur.html" data-i18n="nav_promot">Promoteur</a></li>
                <li><a href="contacts.html" data-i18n="nav_contact">Contacts</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <div class="lang-switcher">
                <button onclick="window.changeLanguage('fr')" id="lang-fr" class="lang-btn">FR</button>
                <span style="color:#eee">|</span>
                <button onclick="window.changeLanguage('de')" id="lang-de" class="lang-btn">DE</button>
                <span style="color:#eee">|</span>
                <button onclick="window.changeLanguage('en')" id="lang-en" class="lang-btn">EN</button>
            </div>

            <div id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <div id="Background">
        <h1 data-i18n="page_title">Découvrez nos biens</h1>
    </div>

    <div id="filter">
        <button class="filter-btn active" data-type="all" data-i18n="filter_all">Tous</button>
        <button class="filter-btn" data-type="acheter" data-i18n="filter_buy">Acheter</button>
        <button class="filter-btn" data-type="louer" data-i18n="filter_rent">Louer</button>
    </div>

    <div id="properties">Chargement...</div>

    <div id="overlay"></div>

    <script type="module">
        // Importiert die createClient Methode direkt aus dem ESM Modul
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // 1. Konfiguration
        const supabaseUrl = 'https://tcljsecaawgczfguujsi.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjbGpzZWNhYXdnY3pmZ3V1anNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTAwMTgsImV4cCI6MjA4ODg4NjAxOH0.sO-iKn8hg1PKdAZnf1ez6dtASYH0PKId4Zx5OmGfHI8';

        // KORREKTUR: Nutze direkt das importierte 'createClient' anstelle von 'window.supabase'
        const supabase = createClient(supabaseUrl, supabaseKey);

        const container = document.getElementById('properties');
        let allProperties = [];

        // 2. Übersetzungen
        const translations = {
            fr: {
                nav_home: "Accueil", nav_acheter: "Nos Biens", nav_vendre: "Vendre",
                nav_invest: "Investissement", nav_gerer: "Faire Gérer", nav_promot: "Promoteur",
                nav_contact: "Contacts", page_title: "Découvrez nos biens",
                filter_all: "Tous", filter_buy: "Acheter", filter_rent: "Louer",
                loading: "Chargement...", on_request: "Prix sur demande"
            },
            de: {
                nav_home: "Startseite", nav_acheter: "Immobilien", nav_vendre: "Verkaufen",
                nav_invest: "Investment", nav_gerer: "Verwaltung", nav_promot: "Bauträger",
                nav_contact: "Kontakt", page_title: "Entdecken Sie unsere Objekte",
                filter_all: "Alle", filter_buy: "Kaufen", filter_rent: "Mieten",
                loading: "Wird geladen...", on_request: "Preis auf Anfrage"
            },
            en: {
                nav_home: "Home", nav_acheter: "Properties", nav_vendre: "Sell",
                nav_invest: "Investment", nav_gerer: "Management", nav_promot: "Developer",
                nav_contact: "Contact", page_title: "Discover our properties",
                filter_all: "All", filter_buy: "Buy", filter_rent: "Rent",
                loading: "Loading...", on_request: "Price on request"
            }
        };

        // 3. Sprache wechseln (Global gemacht für die HTML Buttons)
        window.changeLanguage = (lang) => {
            localStorage.setItem('selectedLanguage', lang);
            location.reload();
        };

        function applyLanguage() {
            const lang = localStorage.getItem('selectedLanguage') || 'fr';
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            return lang;
        }

        // 4. Immobilien rendern
        function render(list) {
            const lang = localStorage.getItem('selectedLanguage') || 'fr';
            container.innerHTML = '';
            
            if (list.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1; text-align:center;">Aucun bien trouvé.</p>';
                return;
            }

            list.forEach(p => {
                let displayTitle = p.title; 
                if (lang === 'de' && p.title_de) displayTitle = p.title_de;
                if (lang === 'en' && p.title_en) displayTitle = p.title_en;

                const priceText = p.preis 
                    ? new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'fr-FR').format(p.preis) + ' €'
                    : translations[lang].on_request;

                // Fallback-Bild falls kein Array existiert oder leer ist
                const imgSrc = (p.images && p.images[0]) || (p.bilder && p.bilder[0]) || 'https://via.placeholder.com/300x200?text=No+Image';

                const div = document.createElement('div');
                div.className = 'property-box';
                div.innerHTML = `
                    <img src="${imgSrc}" alt="${displayTitle}">
                    <h3>${displayTitle}</h3>
                    <p>${priceText}</p>
                `;
                div.onclick = () => window.location.href = `immobilie.html?id=${p.id}`;
                container.appendChild(div);
            });
        }

        // 5. Daten laden & Event Listener
        async function init() {
            const lang = applyLanguage();

            // Hamburger Menu
            document.getElementById("hamburger").onclick = () => {
                document.getElementById("navmenu").classList.toggle("active");
            };

            // Filter Buttons Logik
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelector('.filter-btn.active').classList.remove('active');
                    btn.classList.add('active');
                    const type = btn.dataset.type;
                    if (type === 'all') {
                        render(allProperties);
                    } else {
                        const filtered = allProperties.filter(p => p.type && p.type.toLowerCase() === type.toLowerCase());
                        render(filtered);
                    }
                };
            });

            // Supabase Call
            try {
                // KORREKTUR: Verwende .in() um flexibel sowohl 'aktiv' als auch 'Aktiv' aus der DB zu laden!
                const { data, error } = await supabase
                    .from('immoPromot')
                    .select('*')
                    .in('status', ['aktiv', 'Aktiv']);

                if (error) throw error;
                allProperties = data || [];
                render(allProperties);
            } catch (err) {
                console.error("Supabase Error:", err);
                container.innerHTML = "<p style='color:red; text-align:center;'>Error loading properties.</p>";
            }
        }

        init();
    </script>
</body>

</html>
